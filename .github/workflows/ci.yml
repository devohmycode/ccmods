name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Needs nothing but Node: this is the job that must stay green.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Each mod against its own tsconfig. The root one covers both at
      # once and is `npm run typecheck:all`, but a mod that cannot be
      # compiled alone is a mod that cannot be published alone.
      - name: typecheck each mod
        run: npm run typecheck

      # Every option the code reads must be declared in the manifest.
      # Nothing else catches this: `tsc` types `options` as an open
      # record, and `claude plugin validate` reads the manifest and the
      # source without comparing them.
      - name: options declared match options read
        run: npm run check:options
